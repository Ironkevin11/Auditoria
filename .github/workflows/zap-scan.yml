name: OWASP ZAP Baseline Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL del sitio desplegado en Vercel a escanear"
        required: true
        default: "https://battlecityk.ai.studio/"
  push:
    branches: [main]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Escaneo ZAP Baseline
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar ZAP Baseline Scan
        id: zap_scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ github.event.inputs.target_url || 'https://battlecityk.ai.studio/' }}
          cmd_options: "-a"
          allow_issue_writing: true
          fail_action: false

      - name: Subir reporte como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: warn
